name: Deploy Child Index

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: child-index-deploy
  cancel-in-progress: false

jobs:
  deploy-site:
    name: Deploy GitHub Pages
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build

      - name: Prepare GitHub Pages fallback
        run: cp apps/site/dist/index.html apps/site/dist/404.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./apps/site/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  deploy-functions:
    name: Deploy Supabase Functions
    runs-on: ubuntu-latest
    needs: deploy-site
    permissions:
      contents: read
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF_PROD: ${{ secrets.SUPABASE_PROJECT_REF_PROD }}
      ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
    steps:
      - name: Check child deploy secrets
        id: secrets
        run: |
          if [ -n "$SUPABASE_ACCESS_TOKEN" ] && [ -n "$SUPABASE_PROJECT_REF_PROD" ] && [ -n "$ADMIN_PASSWORD" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Skip Supabase function deploy
        if: ${{ steps.secrets.outputs.ready != 'true' }}
        run: echo "Skipping function deploy because one or more required repo secrets are missing."

      - name: Checkout
        if: ${{ steps.secrets.outputs.ready == 'true' }}
        uses: actions/checkout@v5

      - name: Setup Node
        if: ${{ steps.secrets.outputs.ready == 'true' }}
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        if: ${{ steps.secrets.outputs.ready == 'true' }}
        run: npm ci

      - name: Setup Supabase CLI
        if: ${{ steps.secrets.outputs.ready == 'true' }}
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy Supabase functions
        if: ${{ steps.secrets.outputs.ready == 'true' }}
        run: npm run functions:supabase:deploy:prod
